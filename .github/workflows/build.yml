name: Build Naba APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Unzip project and add wake-word model
        run: |
          unzip -q Naba-Android.zip
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q m.zip
          mkdir -p Naba/app/src/main/assets
          mv vosk-model-small-en-in-0.4 Naba/app/src/main/assets/model-en-in
      - name: Build APK
        working-directory: Naba
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Naba-APK
          path: Naba/app/build/outputs/apk/debug/app-debug.apk
